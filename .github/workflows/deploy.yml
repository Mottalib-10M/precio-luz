name: Precios PVPC y despliegue en GitHub Pages

# Red Eléctrica publica el PVPC del día siguiente hacia las 20:15 (hora de Madrid).
# Horas en UTC: Madrid es UTC+2 hasta el último domingo de octubre y UTC+1 después,
# por eso hay dos pasadas por la tarde (cubren 20:40 y 21:40 en verano, 19:40 y 20:40 en
# invierno), una de rescate, dos tras medianoche (cambio de « hoy ») y una a primera hora
# de la tarde para el mercado al cuarto de hora del día siguiente.
on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '40 18 * * *'
    - cron: '40 19 * * *'
    - cron: '40 20 * * *'
    - cron: '5 22 * * *'
    - cron: '5 23 * * *'
    - cron: '30 13 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Descargar precios (Red Eléctrica) e IPC (INE)
        # Archivo público e·sios sin token. Si algún día hiciera falta la API con token,
        # crear el secreto ESIOS_TOKEN en el repositorio: el script lo recibe aquí.
        env:
          ESIOS_TOKEN: ${{ secrets.ESIOS_TOKEN }}
        run: node scripts/data/fetch-pvpc.mjs
      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "precio-luz-datos"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Datos PVPC del $(TZ=Europe/Madrid date +%F) ($(TZ=Europe/Madrid date +%H:%M) Madrid)"
            git push
          fi
      - name: Tests del motor
        run: npx vitest run
      - name: Build (con control de los snippets)
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
